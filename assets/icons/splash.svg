<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <rect x="150" y="100" width="100" height="100" rx="16" fill="#333" filter="url(#shadow)"/>
  <text x="200" y="175" font-family="monospace" font-size="72" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)">K</text>
  <text x="200" y="250" font-family="monospace" font-size="48" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="6">KRO IDE</text>
  <text x="200" y="290" font-family="monospace" font-size="18" fill="#888" text-anchor="middle" letter-spacing="4">Code. Create. Ship.</text>
  <line x1="160" y1="310" x2="240" y2="310" stroke="#444" stroke-width="1"/>
</svg>